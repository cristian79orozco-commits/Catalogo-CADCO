name: Keep Supabase Active

on:
  schedule:
    # Ejecuta cada 3 días a las 08:00 UTC para evitar la pausa automática por 7 días de inactividad
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          BASE_URL="${SUPABASE_URL%/rest/v1/}"
          BASE_URL="${BASE_URL%/rest/v1}"
          BASE_URL="${BASE_URL%/}"

          HTTP_CODE=$(curl --silent --show-error --output /tmp/supabase_ping.json --write-out "%{http_code}" \
            "${BASE_URL}/rest/v1/brand_config?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Supabase ping HTTP status: ${HTTP_CODE}"
          cat /tmp/supabase_ping.json
          echo ""

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "Error: Supabase ping falló con código ${HTTP_CODE}"
            exit 1
          fi
